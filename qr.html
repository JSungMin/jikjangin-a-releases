<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>직장인A — QR 코드</title>
  <meta name="theme-color" content="#0a0a0a" />
  <link rel="stylesheet" href="./assets/style.css" />
</head>
<body>
  <header>
    <h1>직장인A · QR 코드</h1>
    <p class="subtitle">아래 QR 을 카메라로 스캔하면 설치 페이지로 이동합니다</p>
  </header>

  <section class="card center">
    <img id="qr" alt="설치 페이지 QR" width="280" height="280" />
    <p class="mono" id="qr-url"></p>
    <p><a href="./index.html">← 설치 안내로 돌아가기</a></p>
  </section>

  <script>
    const SITE = window.location.origin + window.location.pathname.replace(/qr\.html$/, "");
    const url = SITE + "index.html";
    document.getElementById("qr-url").textContent = url;
    document.getElementById("qr").src =
      "https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=" + encodeURIComponent(url);
  </script>
</body>
</html>
